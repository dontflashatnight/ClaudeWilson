name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls dist/ClaudeWilson-*.apk | head -n 1)
          SHA_FILE="${APK}.sha256"
          SHA=$(awk '{print $1}' "${SHA_FILE}")
          gh release create "${GITHUB_REF_NAME}" \
            "${APK}" \
            "${SHA_FILE}" \
            --title "ClaudeWilson ${GITHUB_REF_NAME}" \
            --notes "SHA-256: ${SHA}"
