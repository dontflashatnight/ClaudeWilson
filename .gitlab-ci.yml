stages:
  - release

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - test -f dist/ClaudeWilson-0.8.6.apk
  artifacts:
    paths:
      - dist/ClaudeWilson-0.8.6.apk
  release:
    name: 'ClaudeWilson 0.8.6'
    tag_name: '$CI_COMMIT_TAG'
    description: |
      ClaudeWilson 0.8.6 (versionCode 16)

      - Wi-Fi / BLE / sensor / WebView environment hooks
      - Region profile library, vendor OUI, per-identity radio values
      - Verified on ChatGPT: wifi_scan=6, ble_scan=88, sensor_events=1228
      - SHA-256: 0d577dcadcb3417adf02504a3a36e26c040149713bb5b5c794c190c4ea48213b
    assets:
      links:
        - name: 'ClaudeWilson-0.8.6.apk'
          url: '$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/dist/ClaudeWilson-0.8.6.apk?job=release'
